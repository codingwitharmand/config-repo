server:
  port: 8082

spring:
  config:
    import: configserver:http://localhost:8888
  application:
    name: inventory-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true
  instance:
  prefer-ip-address: true

inventory:
  initial-stock: 100

management:
  endpoints:
    web:
      exposure:
        include: "*"