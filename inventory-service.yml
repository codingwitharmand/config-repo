server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true
  instance:
  prefer-ip-address: true

inventory:
  initial-stock: 100

management:
  endpoints:
    web:
      exposure:
        include: "*"
